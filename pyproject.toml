[project]
name = "bookmate"
version = "0.1.0"
description = "AI 기반 공개 북클럽 웹 서비스 BOOKMATE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "psycopg[binary]>=3.2",
    "google-genai>=2.19.0",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]
